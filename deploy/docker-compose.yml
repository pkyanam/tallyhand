# Tallyhand hosted deployment (Docker Compose).
#
# Run from the repo root:
#   ./install.sh            # interactive installer (recommended)
#   # or manually:
#   cp .env.example .env && $EDITOR .env
#   docker compose -f deploy/docker-compose.yml --profile postgres up -d --build   # Postgres
#   docker compose -f deploy/docker-compose.yml up -d --build                      # Convex / external DB
# (the bundled Postgres `db` service only starts with --profile postgres)
#
# The app container applies drizzle/*.sql migrations automatically on start.

name: tallyhand

services:
  db:
    # Only started with --profile postgres (the default for install.sh's
    # Postgres path). Convex / external-DB deployments skip it entirely.
    profiles: ["postgres"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tallyhand
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: tallyhand
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tallyhand -d tallyhand"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      # ${VAR} defaults resolve from .env first: set DATABASE_URL in .env
      # to use an external database instead of the bundled Postgres.
      DATABASE_URL: ${DATABASE_URL:-postgresql://tallyhand:${POSTGRES_PASSWORD}@db:5432/tallyhand}
      TALLY_STORAGE: ${TALLY_STORAGE:-postgres}
      TALLY_AUTH: ${TALLY_AUTH:-builtin}
      TALLYHAND_ATTACHMENTS_DIR: /data/attachments
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      # Local-disk attachment fallback (used when no S3_* vars are set).
      - attachments:/data/attachments
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  pgdata:
  attachments:
