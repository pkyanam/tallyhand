name: Release

# Publishes standalone `tally` binaries via Node SEA (Single Executable Applications).
#
# Flow per matrix target:
#   1. tsup bundles the CLI (cli/src/cli.ts) into a single self-contained file: cli/dist/cli.js
#   2. `node --experimental-sea-config sea-config.json` compiles that bundle into a SEA blob
#   3. The blob is injected into a copy of the runner's own Node 22 binary with postject
#      (NODE_SEA_BLOB / NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b6 sentinel)
#   4. macOS: ad-hoc signature removed (codesign --remove-signature) so Gatekeeper doesn't
#      reject the modified binary; Windows: the binary is named *.exe
#   5. Artifacts are collected, checksummed into SHA256SUMS, and attached to a GitHub
#      Release for the tag.
#
# Assumptions (verify before the first tagged release):
#   - Node 22's `node --experimental-sea-config` accepts the ESM bundle (dist/cli.js is
#     format: esm). SEA historically preferred CJS; if the blob step fails on ESM,
#     switch tsup `format` to cjs for the release build.
#   - The `macos-15-intel` runner label still exists at release time; fall back to
#     `macos-13` if it has been retired.
#   - postject is fetchable via npx in the runner (network access required).
#   - `tally --help` exit code 0 is a sufficient smoke test (commander handles --help).

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            binary: tally-linux-x64
          - target: macos-arm64
            os: macos-14
            binary: tally-macos-arm64
          - target: macos-x64
            os: macos-15-intel
            binary: tally-macos-x64
          - target: windows-x64
            os: windows-latest
            binary: tally-windows-x64.exe
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci

      - name: Bundle CLI with tsup
        working-directory: cli
        run: npm run build

      - name: Generate SEA blob
        working-directory: cli
        shell: bash
        run: |
          cat > sea-config.json <<'EOF'
          {
            "main": "dist/cli.js",
            "output": "sea-prep.blob",
            "disableExperimentalSEAWarning": true
          }
          EOF
          node --experimental-sea-config sea-config.json

      - name: Inject blob into Node binary
        if: runner.os != 'Windows'
        working-directory: cli
        shell: bash
        run: |
          NODE_BIN="$(node -e 'console.log(process.execPath)')"
          cp "$NODE_BIN" "${{ matrix.binary }}"
          chmod +x "${{ matrix.binary }}"
          npx --yes postject "${{ matrix.binary }}" NODE_SEA_BLOB sea-prep.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b6
          rm -f sea-prep.blob sea-config.json

      - name: Inject blob into Node binary (Windows)
        if: runner.os == 'Windows'
        working-directory: cli
        shell: pwsh
        run: |
          $nodeBin = node -e "console.log(process.execPath)"
          Copy-Item $nodeBin "${{ matrix.binary }}"
          npx --yes postject "${{ matrix.binary }}" NODE_SEA_BLOB sea-prep.blob `
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b6
          Remove-Item sea-prep.blob, sea-config.json

      - name: Remove macOS code signature
        if: startsWith(matrix.target, 'macos')
        working-directory: cli
        shell: bash
        run: codesign --remove-signature "${{ matrix.binary }}"

      - name: Smoke test binary
        working-directory: cli
        shell: bash
        run: ./"${{ matrix.binary }}" --help

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: cli/${{ matrix.binary }}
          if-no-files-found: error

  release:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum tally-* > SHA256SUMS
          cat SHA256SUMS

      - name: Attach binaries and checksums to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tally-*
            dist/SHA256SUMS
