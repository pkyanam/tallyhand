name: Release

# Publishes standalone `tally` binaries via `bun build --compile`.
#
# Flow per matrix target:
#   1. tsup bundles the CLI (cli/src/cli.ts) into a single self-contained file: cli/dist/cli.js
#      (kept as the canonical bundle step — the same artifact `npm run build` produces)
#   2. `bun build --compile` turns that bundle into a single-file executable for the
#      matrix target. No postject, no blob injection, no code-signature surgery.
#   3. macOS: ad-hoc sign (`codesign -s -`) so the binary isn't flagged as damaged.
#      Windows: the binary is named *.exe.
#   4. Smoke test asserts the binary actually runs its entry point (`Usage:` in
#      --help output — a bare exit-0 check would pass even for a dead binary).
#   5. Artifacts are collected, checksummed into SHA256SUMS, and attached to a GitHub
#      Release for the tag.
#
# Why bun and not Node SEA: postject (the SEA blob injector) cannot parse current
# official Node binaries (~256 .note sections break its section parser, so the
# post-injection sentinel lookup fails on every platform). Bun's compiler embeds
# its own runtime and needs no injection step.
#
# Note: the CLI's entry guard (shouldAutoRun in cli/src/cli.ts) must keep its
# "packaged binary" branch — in a compiled binary argv[1] is the first user
# argument, not the script path.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            binary: tally-linux-x64
            bun_target: bun-linux-x64
          - target: macos-arm64
            os: macos-14
            binary: tally-macos-arm64
            bun_target: bun-darwin-arm64
          - target: macos-x64
            os: macos-15-intel
            binary: tally-macos-x64
            bun_target: bun-darwin-x64
          - target: windows-x64
            os: windows-latest
            binary: tally-windows-x64.exe
            bun_target: bun-windows-x64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci

      - name: Bundle CLI with tsup
        working-directory: cli
        run: npm run build

      - name: Compile standalone binary
        working-directory: cli
        shell: bash
        run: bun build --compile ./dist/cli.js --outfile "${{ matrix.binary }}" --target "${{ matrix.bun_target }}"

      - name: Ad-hoc sign macOS binary
        if: startsWith(matrix.target, 'macos')
        working-directory: cli
        shell: bash
        run: codesign --sign - --force "${{ matrix.binary }}"

      - name: Smoke test binary
        working-directory: cli
        shell: bash
        run: ./\"${{ matrix.binary }}\" --help | grep -q "Usage:"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: cli/${{ matrix.binary }}
          if-no-files-found: error

  release:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum tally-* > SHA256SUMS
          cat SHA256SUMS

      - name: Attach binaries and checksums to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tally-*
            dist/SHA256SUMS
